plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mms_settings" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

configurations {
    runtimeMods {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly files(
        "libs/26.3/modmenu-${project.modmenu_version}.jar",
        "libs/26.3/open-parties-and-claims-fabric-26.3-${project.opac_version}.jar"
    )

    // Dev runtime: Mod Menu, Open Parties and Claims and the config library it needs.
    runtimeMods files(
        "libs/26.3/modmenu-${project.modmenu_version}.jar",
        "libs/26.3/open-parties-and-claims-fabric-26.3-${project.opac_version}.jar",
        "libs/26.3/ForgeConfigAPIPort-v${project.forgeconfig_version}-mc26.3.x-Fabric.jar"
    )
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

processResources {
    // declare the version as an input so bumping gradle.properties
    // invalidates the task (expand values are not tracked automatically)
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Fails the build when a plain class sits in a mixin-owned package.
def checkMixinPackages = tasks.register('checkMixinPackages', Exec) {
    dependsOn tasks.named('jar')
    doFirst {
        commandLine 'python3',
                "$projectDir/gradle/scripts/check-mixin-packages.py",
                tasks.named('jar').get().archiveFile.get().asFile
    }
}

tasks.named('build') { dependsOn checkMixinPackages }

// Copies the runtime mods into the dev run's mods folder.
tasks.register("syncRuntimeMods") {
    inputs.files(configurations.runtimeMods)
    doLast {
        copy {
            from configurations.runtimeMods
            into file("run/mods")
        }
    }
}

["runClient", "runServer"].each { runName ->
    tasks.named(runName) {
        dependsOn "syncRuntimeMods"
    }
}
